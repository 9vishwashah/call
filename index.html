<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Call List</title>

<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
    background: #f2f4f7;
    margin: 0;
    padding: 16px;
  }

  h2 {
    margin-bottom: 16px;
  }

  .list-container {
    max-width: 500px;
    margin: auto;
  }

  .row {
    background: #ffffff;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 40px 1fr 70px;
    align-items: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .sr {
    font-weight: 600;
    color: #555;
  }

  .name {
    font-size: 15px;
    font-weight: 500;
    color: #222;
  }

  .call-btn {
    text-align: center;
    background: #2e7d32;
    color: #fff;
    text-decoration: none;
    padding: 8px 0;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
  }

  .call-btn:active {
    background: #256528;
  }
</style>
</head>

<body>

<h2>📞 Call List</h2>

<div class="list-container" id="list">
  Loading...
</div>

<script>
fetch("https://docs.google.com/spreadsheets/d/1QXUuzeAkqEUhul7Cpmz1kowOkrjh530VvCZqfWrCSUI/export?format=csv&gid=0")
  .then(res => res.text())
  .then(csv => {
    const rows = csv.split("\n").slice(1);
    const list = document.getElementById("list");
    list.innerHTML = "";

    let sr = 1;

    rows.forEach(row => {
      if (!row.trim()) return;

      const [name, phone] = row.split(",");

      list.innerHTML += `
        <div class="row">
          <div class="sr">${sr++}</div>
          <div class="name">${name}</div>
          <a class="call-btn" href="tel:${phone.trim()}">Call</a>
        </div>
      `;
    });
  })
  .catch(err => {
    document.getElementById("list").innerText = "Failed to load data";
    console.error(err);
  });
</script>

</body>
</html>
